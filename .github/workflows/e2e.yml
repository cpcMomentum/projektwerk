name: e2e

# Klicktests gegen eine echte, bedienbare Nextcloud. Die Schritte liegen in nc-app-tooling, die Specs in tests/e2e.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    uses: cpcMomentum/nc-app-tooling/.github/workflows/e2e.yml@v1.21.0
    with:
      url-env: PWERK_E2E_URL
      occ-env: PWERK_OCC
