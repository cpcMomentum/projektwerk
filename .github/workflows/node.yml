name: node

# Frontend-Gate: Typecheck + vitest + Produktions-Build muessen gruen sein.
# Laeuft auf ALLEN PRs (kein paths-Filter): als Required-Status-Check muss der
# Workflow immer melden, sonst blockiert ein nie-startender Check den Merge.
# (Kein lint-Script in package.json; --passWithNoTests, da noch keine
# Frontend-Tests existieren — der Schritt bleibt vorbereitet.)

on:
  push:
    branches: [main, develop]
  pull_request:
  # Manuelles Nachtriggern — wie bei phpunit, integration und e2e.
  #
  # `node` war das einzige der vier Gates ohne diesen Auslöser. Am 11.08.2026
  # kamen `pull_request`-Events stundenlang gar nicht an (dasselbe Muster wie
  # der Incident vom 06.08.), `workflow_dispatch` lief unbeeindruckt weiter —
  # und ausgerechnet das Frontend-Gate war dann als einziges nicht von Hand
  # auslösbar. Ein Required Check, den man im Störfall nicht starten kann,
  # blockiert den Merge ohne Aussage über den Code.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 ist seit 2026-04-30 EOL. @nextcloud/eslint-config@9 verlangt
          # ^22.14 || ^24 || >=26, @nextcloud/vue@9 deklariert devEngines ^24.
          # 24 ist LTS bis 2028-04-30.
          node-version: '24'

      - name: Abhaengigkeiten installieren
        # `npm ci` statt `npm install`, und das Lockfile bleibt liegen. Bis zum
        # 15.08.2026 stand hier `rm -f package-lock.json` mit Verweis auf
        # npm/cli#4828 (fehlendes rollup-Binary). Der Fehler, der tatsaechlich
        # auftrat, war ein anderer: npm 10 meldet auf einem synchronen Lock
        # faelschlich "Missing: pinia@3.0.4". Mit npm 11 -- das mit Node 24
        # kommt -- laeuft `npm ci` durch.
        #
        # Das ist die Voraussetzung fuer den Frische-Schritt weiter unten:
        # ohne gepinnte Installation weicht der CI-Build vom lokalen ab und der
        # Vergleich meldet immer (nc-app-tooling#1).
        run: npm ci

      # Faengt Strings ab, die in t()/n()/->t() stehen, aber in keiner l10n-Datei.
      # Solche Texte fallen in JEDER Sprache auf den deutschen Quelltext zurueck.
      # Die 21 Backend-Texte, die dieser Schritt zuerst gefunden hat, standen seit
      # dem Bootstrap unuebersetzt in Benachrichtigungen und Setup-Checks.
      - name: l10n-Vollstaendigkeit
        run: npm run l10n:check

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend-Unit-Tests (vitest)
        run: npm test -- --passWithNoTests

      - name: Produktions-Build
        run: npm run build

      # Der eigentliche Frische-Test: passt das eingecheckte Bundle zu den
      # Quellen? Der Schritt darueber hat gerade neu gebaut -- weicht js/ oder
      # css/ jetzt vom Commit ab, wurde beim Aendern der Quellen der Build
      # vergessen. Genau so blieb bei contractmanager#327 eine verwundbare
      # dompurify-Version im ausgelieferten Bundle stehen.
      #
      # Gemessen statt geraten. Der Vorgaenger (nc-bundle-check) schloss aus
      # "src/ geaendert, js/ nicht" auf eine Absicht und lag bei reinen Typ- und
      # Kommentaraenderungen falsch; sein Ausweg [skip bundle-check] hebelte ihn
      # ganz aus. Beides faellt hiermit weg (nc-app-tooling#1).
      #
      # Traegt, weil der Build byte-reproduzierbar ist: alle fuenf Apps bauen
      # unter Linux mit npm 11 aus dem auf macOS erzeugten Lockfile
      # byte-identisch (nachgemessen 15.08.2026, Node 20/22/24 einzeln).
      #
      # git status statt git diff: der Diff sieht nur getrackte Dateien. Bei
      # worktime und rechnungswerk tragen die Chunks Content-Hashes im Namen --
      # ein neu entstandener Chunk kaeme als UNTRACKED daher und rutschte
      # durch, waehrend die alte Datei unveraendert daneben liegen bleibt.
      # status --porcelain erfasst geaendert, geloescht und neu.
      - name: Bundle passt zum Quellstand
        run: |
          ABWEICHUNG=$(git status --porcelain -- js/ css/)
          if [ -n "$ABWEICHUNG" ]; then
            echo "$ABWEICHUNG"
            echo "::error::Das eingecheckte Bundle passt nicht zu den Quellen. Bitte 'npm run build' laufen lassen und das Ergebnis mitcommitten."
            exit 1
          fi
